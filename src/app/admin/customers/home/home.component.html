<div class="content-wrapper">

  <div class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h1 class="m-0">Clientes</h1>
        </div>
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item"><a href="/admin/dashboard">Inicio</a></li>
            <li class="breadcrumb-item active">Clientes</li>
          </ol>
        </div>
      </div>
    </div>
  </div>

  <section class="content">

    <div class="container-fluid mb-3">
      <div class="text-right">
        <a class="btn btn-success mr-2" routerLink="/admin/customers/create">
          <i class="fas fa-plus"></i> Agregar Cliente
        </a>
        <div class="btn-group" role="group">
          <button type="button"
            class="btn"
            [class.btn-primary]="displayMode === 'grid'"
            [class.btn-outline-primary]="displayMode !== 'grid'"
            (click)="toggleViewMode('grid')">
            <i class="fas fa-th-large"></i>
          </button>
          <button type="button"
              class="btn"
              [class.btn-primary]="displayMode === 'list'"
              [class.btn-outline-primary]="displayMode !== 'list'"
              (click)="toggleViewMode('list')">
            <i class="fas fa-list"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Search -->
    <div class="container-fluid mb-3">
      <div class="input-group">
        <div class="input-group-prepend">
          <span class="input-group-text">
            <i class="fas fa-search"></i>
          </span>
        </div>
        <input type="text"
          class="form-control"
          placeholder="Buscar por nombre..."
          [(ngModel)]="searchTerm">
      </div>
    </div>

    <div class="container-fluid">

      <!-- Empty array results -->
      <div *ngIf="customers.length === 0" class="alert alert-warning">
        <div class="p-2"><i class="fas fa-exclamation-triangle mr-2"></i> No hay clientes para mostrar.</div>
      </div>

      <!-- Empty search results -->
      <div *ngIf="customers.length > 0 && filteredCustomers.length === 0" class="no-results">
        <i class="fas fa-search"></i>
        <p>No hay resultados para la búsqueda <strong>"{{searchTerm}}"</strong></p>
      </div>

      <!-- Grid View -->
      <div class="row mt-5" *ngIf="displayMode === 'grid' && filteredCustomers.length > 0">
        <div class="col-12 col-sm-6 col-md-4" *ngFor="let customer of filteredCustomers">
          <customer-tile [customer]="customer" [display]="'grid'"></customer-tile>
        </div>
      </div>

      <!-- List View -->
      <div class="table-responsive" *ngIf="displayMode === 'list' && filteredCustomers.length > 0">
        <div class="row" *ngFor="let customer of filteredCustomers">
          <div class="col-12">
            <customer-tile [customer]="customer" [display]="'list'"></customer-tile>
          </div>
        </div>
      </div>
    </div>
  </section>

</div>
