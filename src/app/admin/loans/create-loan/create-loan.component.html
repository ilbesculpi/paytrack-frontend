<div class="content-wrapper">

  <div class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h1 class="m-0">Clientes &middot; <small class="text-muted">Nuevo Préstamo</small></h1>
        </div>
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item"><a routerLink="/admin/dashboard">Inicio</a></li>
            <li class="breadcrumb-item"><a routerLink="/admin/loans">Préstamos</a></li>
            <li class="breadcrumb-item active">Nuevo Préstamo</li>
          </ol>
        </div>
      </div>
    </div>
  </div>

  <section class="content">

    <div class="container-fluid">

      <div class="card">

        <div class="card-body">

          <form [formGroup]="form" (ngSubmit)="submit()">

            <div class="form-group">
              <label for="customer_id">Cliente</label>
              <select id="customer_id" class="form-control"
                formControlName="customer_id"
                [ngClass]="{'is-invalid': isFieldInvalid('customer_id')}">
                <option [value]="customer.id" *ngFor="let customer of customers()">{{ customer.full_name }}</option>
              </select>
              <div class="invalid-feedback" *ngIf="hasError('customer_id', 'required')">
                Seleccione un cliente de la lista
              </div>
            </div>

            <div class="form-group">
              <label for="amount">Monto Solicitado</label>
              <input type="number" id="amount" class="form-control"
                formControlName="amount"
                [ngClass]="{'is-invalid': isFieldInvalid('amount')}">
            </div>

            <div class="form-group">
              <label for="interest">Tasa de Interés</label>
              <input type="number" id="interest" class="form-control"
                formControlName="interest" min="0" max="100"
                [ngClass]="{'is-invalid': isFieldInvalid('interest')}">
            </div>

            <div class="form-group">
              <label for="notes">Notas</label>
              <textarea id="notes" class="form-control" rows="3"
                formControlName="notes"
                [ngClass]="{'is-invalid': isFieldInvalid('notes')}"></textarea>
            </div>

            <div class="form-actions text-right">
              <button type="submit" class="btn btn-primary mr-2" [disabled]="form.invalid">
                Guardar
              </button>
              <a class="btn btn-secondary" routerLink="/admin/loans">
                Cancelar
              </a>
            </div>

          </form>

        </div>

      </div>

    </div>

  </section>

</div>
