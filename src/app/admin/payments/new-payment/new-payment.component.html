<div class="content-wrapper">

  <div class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h1 class="m-0">Clientes &middot; <small class="text-muted">Registrar Pago</small></h1>
        </div>
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item"><a routerLink="/admin/dashboard">Inicio</a></li>
            <li class="breadcrumb-item"><a routerLink="/admin/loans">Préstamos</a></li>
            <li class="breadcrumb-item" *ngIf="customer() as customer"><a [routerLink]="['/admin/customers', customer.id, 'view']">{{ customer.full_name }}</a></li>
            <li class="breadcrumb-item" *ngIf="loan() as loan"><a [routerLink]="['/admin/loans', loan.id, 'view']">{{ loan.id }}</a></li>
            <li class="breadcrumb-item active">Registrar Pago</li>
          </ol>
        </div>
      </div>
    </div>
  </div>

  <section class="content">

    <div class="container-fluid">

      <div class="card">

        <div class="card-body">

          <form [formGroup]="form" (ngSubmit)="submit()">

            <div class="form-group">
              <label for="payment_date">Fecha de Pago</label>
              <div class="input-group date" id="payment_date" data-target-input="nearest">
                <input type="text" class="form-control datetimepicker-input" data-target="#payment_date"
                  [ngClass]="{'is-invalid': isFieldInvalid('payment_date')}">
                <div class="input-group-append" data-target="#payment_date" data-toggle="datetimepicker">
                    <div class="input-group-text"><i class="fa fa-calendar"></i></div>
                </div>
              </div>
              <div class="invalid-feedback" *ngIf="hasError('payment_date', 'required')">
                Ingrese la fecha del pago
              </div>
            </div>

            <div class="form-group">
              <label for="payment_method">Método de Pago</label>
              <select id="payment_method" class="form-control"
                formControlName="payment_method"
                [ngClass]="{'is-invalid': isFieldInvalid('payment_method')}">
                <option value="" disabled selected>- Seleccione -</option>
                <option value="cash">Efectivo</option>
                <option value="wire">Transferencia</option>
                <option value="other">Otro</option>
              </select>
              <div class="invalid-feedback" *ngIf="hasError('payment_method', 'required')">
                Seleccione un método de la lista
              </div>
            </div>

            <div class="row form-group">
              <div class="col">
                <label for="payment_capital">Capital</label>
                <input type="number" id="payment_capital" class="form-control"
                  formControlName="payment_capital"
                  [ngClass]="{'is-invalid': isFieldInvalid('payment_capital')}">
                <div class="invalid-feedback" *ngIf="hasError('payment_capital', 'required')">
                  Ingrese el monto del pago
                </div>
              </div>
              <div class="col">
                <label for="payment_interest">Intereses</label>
                <input type="number" id="payment_interest" class="form-control"
                  formControlName="payment_interest"
                  [ngClass]="{'is-invalid': isFieldInvalid('payment_interest')}">
                <div class="invalid-feedback" *ngIf="hasError('payment_interest', 'required')">
                  Ingrese el monto del pago
                </div>
              </div>
              <div class="col">
                <label for="payment_delay">Demora</label>
                <input type="number" id="payment_delay" class="form-control"
                  formControlName="payment_delay"
                  [ngClass]="{'is-invalid': isFieldInvalid('payment_delay')}">
                <div class="invalid-feedback" *ngIf="hasError('payment_delay', 'required')">
                  Ingrese el monto del pago
                </div>
              </div>
            </div>

            <div class="form-group">
              <label for="payment_amount">Monto total del Pago</label>
              <input type="number" id="payment_amount" class="form-control" readonly
                formControlName="payment_amount"
                [ngClass]="{'is-invalid': isFieldInvalid('payment_amount')}">
              <div class="invalid-feedback" *ngIf="hasError('payment_amount', 'required')">
                Ingrese el monto del pago
              </div>
            </div>

            <div class="form-group">
              <label for="notes">Notas</label>
              <textarea id="notes" class="form-control" rows="3"
                formControlName="notes"
                [ngClass]="{'is-invalid': isFieldInvalid('notes')}"></textarea>
            </div>


            <div class="form-actions text-right">
              <button type="submit" class="btn btn-primary mr-2" [disabled]="form.invalid">
                Guardar
              </button>
              <a class="btn btn-secondary" routerLink="/admin/loans">
                Cancelar
              </a>
            </div>

          </form>

        </div>

      </div>

    </div>

  </section>

</div>
